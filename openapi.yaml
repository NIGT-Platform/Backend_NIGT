openapi: 3.0.3
info:
  title: NIGT Transportation Operations Management API
  version: 1.0.0
  description: Authentication and Admin Approval API documentation for NIGT.

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Authentication
  - name: Email Verification
  - name: Password Management
  - name: Admin User Management
  - name: Vehicle Management

paths:
  /api/auth/register/vehicle-owner:
    post:
      tags: [Authentication]
      summary: Register a vehicle owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleOwnerRegistrationRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: Validation error
        '409':
          description: Email already exists

  /api/auth/register/driver:
    post:
      tags: [Authentication]
      summary: Register a driver
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - phoneNumber
                - licenseNumber
                - licenseType
                - licenseExpiryDate
                - licenseDocument
                - password
                - confirmPassword
              properties:
                firstName:
                  type: string
                middleName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                phoneNumber:
                  type: string
                licenseNumber:
                  type: string
                licenseType:
                  type: string
                licenseExpiryDate:
                  type: string
                  format: date
                licenseDocument:
                  type: string
                  format: binary
                password:
                  type: string
                  format: password
                confirmPassword:
                  type: string
                  format: password
      responses:
        '201':
          description: Driver registered successfully
        '400':
          description: Validation or upload error
        '409':
          description: Email or license number already exists

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
        '403':
          description: Account not active or email not verified

  /api/auth/verify-email:
    post:
      tags: [Email Verification]
      summary: Verify email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid or expired token

  /api/auth/resend-verification:
    post:
      tags: [Email Verification]
      summary: Resend verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification email sent

  /api/auth/forgot-password:
    post:
      tags: [Password Management]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset email sent

  /api/auth/reset-password:
    post:
      tags: [Password Management]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, confirmPassword]
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
                confirmPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Invalid or expired reset token

  /api/auth/refresh-token:
    post:
      tags: [Authentication]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Access token refreshed
        '401':
          description: Invalid refresh token

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthorized

  /api/admin/users:
    get:
      tags: [Admin User Management]
      summary: Get all users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '403':
          description: Admin access required

  /api/admin/users/pending:
    get:
      tags: [Admin User Management]
      summary: Get pending users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending users retrieved successfully
        '401':
          description: Unauthorized
        '403':
          description: Admin access required

  /api/admin/users/{id}:
    get:
      tags: [Admin User Management]
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

  /api/admin/users/{id}/approve:
    patch:
      tags: [Admin User Management]
      summary: Approve user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User approved successfully
        '404':
          description: User not found

  /api/admin/users/{id}/reject:
    patch:
      tags: [Admin User Management]
      summary: Reject user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User rejected successfully
        '404':
          description: User not found

  /api/admin/users/{id}/suspend:
    patch:
      tags: [Admin User Management]
      summary: Suspend user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User suspended successfully
        '404':
          description: User not found

  /api/vehicles:
    post:
      tags: [Vehicle Management]
      summary: Register a new vehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterVehicleRequest'
      responses:
        '201':
          description: Vehicle registered successfully
        '400':
          description: Validation error
        '409':
          description: Plate number already exists

  /api/vehicles/my-vehicles:
    get:
      tags: [Vehicle Management]
      summary: Get current owner's vehicles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success

  /api/vehicles/{id}:
    get:
      tags: [Vehicle Management]
      summary: Get vehicle details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
    patch:
      tags: [Vehicle Management]
      summary: Update a vehicle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterVehicleRequest'
      responses:
        '200':
          description: Success

  /api/vehicles/{id}/documents:
    post:
      tags: [Vehicle Management]
      summary: Upload a vehicle document
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                documentType:
                  type: string
                  enum: [VEHICLE_REGISTRATION, INSURANCE, INSPECTION]
                document:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document uploaded successfully

  /api/admin/vehicles:
    get:
      tags: [Vehicle Management]
      summary: Get all vehicles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success

  /api/admin/vehicles/pending:
    get:
      tags: [Vehicle Management]
      summary: Get pending vehicles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success

  /api/admin/vehicles/{id}:
    get:
      tags: [Vehicle Management]
      summary: Get vehicle by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success

  /api/admin/vehicles/{id}/approve:
    patch:
      tags: [Vehicle Management]
      summary: Approve vehicle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success

  /api/admin/vehicles/{id}/reject:
    patch:
      tags: [Vehicle Management]
      summary: Reject vehicle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success

  /api/admin/vehicles/{id}/suspend:
    patch:
      tags: [Vehicle Management]
      summary: Suspend vehicle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        middleName:
          type: string
          nullable: true
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        role:
          type: string
          enum: [ADMIN, VEHICLE_OWNER, DRIVER]
        accountStatus:
          type: string
          enum: [PENDING, ACTIVE, REJECTED, SUSPENDED]
        emailVerified:
          type: boolean

    VehicleOwnerRegistrationRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phoneNumber
        - password
        - confirmPassword
      properties:
        firstName:
          type: string
        middleName:
          type: string
          nullable: true
        lastName:
          type: string
        email:
          type: string
          format: email
        phoneNumber:
          type: string
        password:
          type: string
          format: password
        confirmPassword:
          type: string
          format: password

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string

    RegistrationResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'

    RegisterVehicleRequest:
      type: object
      required:
        - plateNumber
        - vehicleType
        - brand
        - model
        - manufacturingYear
        - capacity
        - capacityUnit
      properties:
        plateNumber:
          type: string
        vehicleType:
          type: string
          enum: [TRUCK, VAN, TRAILER, OTHER]
        brand:
          type: string
        model:
          type: string
        manufacturingYear:
          type: integer
        capacity:
          type: number
        capacityUnit:
          type: string
          enum: [TON, KG]
